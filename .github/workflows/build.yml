name: Build Windows EXE

# Runs when you push a version tag (e.g. `git tag v1.0.0 && git push --tags`),
# which builds the .exe and attaches it to a GitHub Release automatically.
# You can also trigger it manually from the Actions tab to just get a
# downloadable build artifact without making a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pynput pyinstaller

      - name: Build MacroKai.exe
        run: |
          pyinstaller --onefile --noconsole --name MacroKai macro_tool.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroKai-windows
          path: dist/MacroKai.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MacroKai.exe
          generate_release_notes: true
