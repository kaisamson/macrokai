name: Build Windows App

# Runs when you push a version tag (e.g. `git tag v1.0.0 && git push --tags`),
# which builds MacroKai and attaches it to a GitHub Release automatically.
# You can also trigger it manually from the Actions tab to just get a
# downloadable build artifact without making a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pynput pyinstaller

      - name: Build MacroKai
        # --onedir (a folder, not a self-extracting single .exe) and --noupx
        # meaningfully cut down on antivirus false positives compared to
        # --onefile, which a lot of AV heuristics associate with droppers.
        run: |
          pyinstaller --onedir --noupx --noconsole --name MacroKai --version-file version_info.txt macro_tool.py

      - name: Zip the build
        run: |
          Compress-Archive -Path dist/MacroKai/* -DestinationPath MacroKai-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroKai-windows
          path: MacroKai-windows.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MacroKai-windows.zip
          generate_release_notes: true
